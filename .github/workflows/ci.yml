name: Iris Model CI

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install Python & CML dependencies
        run: |
          pip install -r requirements.txt
          npm install -g cml

      - name: Authenticate to GCP
        uses: 'google-github-actions/auth@v1'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Pull DVC data and model
        run: dvc pull

      - name: Run Pytest and Create CML Report
        env:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pytest > report.txt
          cat report.txt
          # FIX: Use npx to reliably execute the cml command
          npx cml comment create --headline "## Pytest Sanity Check" report.txt
