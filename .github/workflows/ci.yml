name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Authenticate with GCP
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
      
      - name: Pull data and model from DVC
        run: |
          dvc pull
      
      - name: Run pytest with coverage
        run: |
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=term
      
      - name: Setup CML
        uses: iterative/setup-cml@v1
      
      - name: Create CML Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Generate test report
          echo "## Test Results" > report.md
          echo "" >> report.md
          
          # Add pytest results
          echo "### Pytest Summary" >> report.md
          pytest tests/ -v --tb=short > pytest_output.txt 2>&1 || true
          echo '```' >> report.md
          cat pytest_output.txt >> report.md
          echo '```' >> report.md
          
          # Add coverage information
          echo "" >> report.md
          echo "### Coverage Report" >> report.md
          echo '```' >> report.md
          coverage report >> report.md 2>&1 || echo "Coverage report not available" >> report.md
          echo '```' >> report.md
          
          # Post comment with CML
          cml comment create report.md
